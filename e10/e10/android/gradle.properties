org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G --enable-native-access=ALL-UNNAMED -Djava.net.preferIPv4Stack=true
# Disabled: this sandboxed environment blocks the Gradle daemon's loopback
# socket ("Unable to establish loopback connection"), the same kind of
# restriction that blocked dart.exe subprocess spawning earlier — running
# without a daemon avoids needing that local socket at all.
org.gradle.daemon=false
# The Kotlin compiler normally runs in its own worker process, which needs
# the same loopback socket the main Gradle daemon needed above — force it
# in-process too instead of trying to spawn/talk to a separate daemon.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
